<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonificación Familiar 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;background:#0f1c2e;color:#fff;margin:0}
.header{padding:20px;background:#13567F;display:flex;gap:15px;align-items:center}
.logo{width:70px}
.container{padding:20px;max-width:1200px;margin:auto}
.card{background:#fff;color:#000;padding:20px;border-radius:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

input,select,textarea{
padding:10px;border:1px solid #ccc;border-radius:6px;width:100%;
}

.section{background:#1A2746;color:#A1F40C;padding:10px;margin:15px 0;border-radius:6px}

button{padding:10px 15px;border:0;border-radius:6px;background:#A1F40C;font-weight:bold;cursor:pointer}

.tabcontent{display:none}
.tabcontent.active{display:block}
</style>
</head>

<body>

<div class="header">
<img src="Escudo_Policía_Nacional_de_Colombia.png" class="logo">
<h2>Bonificación Familiar 2026</h2>
</div>

<div class="container">
<div class="card">

<!-- BOTONES -->
<button onclick="showTab('registro')">Registro</button>
<button onclick="showTab('consulta')">Consultar</button>

<!-- REGISTRO -->
<div id="registro" class="tabcontent active">

<form id="formBonificacion">

<div class="grid">

<input id="cedulaTitular" placeholder="Cédula Titular">

<select id="tramite">
<option>RECONOCER</option>
<option>DISMINUIR</option>
</select>

<select id="concepto">
<option>BONIFICACION FAMILIAR</option>
</select>

<select id="estado">
<option>OK</option>
<option>FALTA REGISTRAR</option>
</select>

</div>

<div class="section">Fechas</div>

<div class="grid">
<input type="date" id="fechaJ">
<input type="date" id="fechaK">
<input id="observaciones" placeholder="Observaciones">
</div>

<div class="section">Beneficiario</div>

<div class="grid">

<select id="beneficiario">
<option>HIJO1</option>
<option>HIJA1</option>
<option>COMPAÑERO</option>
<option>COMPAÑERA</option>
<option>CÓNYUGE</option>
</select>

<input id="nombreBeneficiario" placeholder="Nombre">
<input id="cedulaBeneficiario" placeholder="Cédula">

<select id="sexo">
<option>M</option>
<option>F</option>
</select>

<input type="date" id="fechaNacimiento">

<select id="tipoDocumento">
<option>CC</option>
<option>TI</option>
<option>RC</option>
<option>RM</option>
</select>

</div>

<div class="section">Soportes</div>

<div class="grid">

<select id="documentoSoporte">
<option>Acta de Conciliación</option>
<option>Registro Civil</option>
<option>Certificado Escolar</option>
</select>

<input id="expedidoPor" placeholder="Expedido por">
<input id="ciudadSede" placeholder="Ciudad Sede">
<input type="date" id="fechaDocumento">
<input id="actoAdministrativo" placeholder="N° Acto Administrativo">

<select id="proyectoResolucion">
<option>SI</option>
<option>NO</option>
</select>

</div>

<br>

<button type="submit">Guardar</button>

</form>
</div>

<!-- CONSULTA -->
<div id="consulta" class="tabcontent">

<input id="cedulaBuscar" placeholder="Cédula">
<button onclick="buscarRegistro()">Buscar</button>

<br><br>

<textarea id="textoConsulta" style="width:100%;height:300px"></textarea>

</div>

</div>
</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbz8DyZGRhugSLe9PwlDS_x9LMvY8jL7lhPc3ZXg9y49R-xnA8vGtIhqzYtXOy6Jv9dM/exec";

function showTab(id){
document.querySelectorAll(".tabcontent").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// ======================================================
// 💾 GUARDAR (VERSIÓN ESTABLE GET)
// ======================================================
document.getElementById("formBonificacion").addEventListener("submit", async (e)=>{

e.preventDefault();

const data = {
action:"guardar",
E:cedulaTitular.value,
F:concepto.value,
H:observaciones.value,
I:estado.value,
J:fechaJ.value,
K:fechaK.value,
O:cedulaTitular.value,
P:beneficiario.value,
Y:nombreBeneficiario.value,
Z:cedulaBeneficiario.value,
AA:sexo.value,
AC:fechaNacimiento.value,
AE:tipoDocumento.value,
AH:documentoSoporte.value,
AI:expedidoPor.value,
AJ:ciudadSede.value,
AK:fechaDocumento.value,
AL:actoAdministrativo.value,
AT:proyectoResolucion.value
};

// 🔥 ENVIAR POR GET (SIN POST)
const url = WEBAPP_URL + "?" + new URLSearchParams(data);

try{

const res = await fetch(url);
const json = await res.json();

if(json.success){
alert("Guardado en fila: " + json.fila);
}else{
alert(json.error || "Error al guardar");
}

}catch(err){
alert("Error conexión: " + err.message);
}

});

// ======================================================
// 🔍 BUSCAR + AUTOLLENADO
// ======================================================
async function buscarRegistro(){

const cedula = cedulaBuscar.value.trim();

const url = WEBAPP_URL + "?action=buscar&cedula=" + cedula;

const res = await fetch(url);
const json = await res.json();

if(!json.success || json.registros.length === 0){
textoConsulta.value = "No encontrado";
return;
}

const r = json.registros[0];

// 🔥 AUTOLLENADO
cedulaTitular.value = r.cedula || "";
beneficiario.value = r.beneficiario || "";
nombreBeneficiario.value = r.nombreBeneficiario || "";
cedulaBeneficiario.value = r.documentoBeneficiario || "";
sexo.value = r.sexo || "";
estado.value = r.estado || "";
observaciones.value = r.observaciones || "";
fechaJ.value = r.fechaJ || "";
fechaK.value = r.fechaK || "";

textoConsulta.value = JSON.stringify(json.registros, null, 2);

alert("Datos cargados");

}

</script>

</body>
</html>
