<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BONIFICACIÓN FAMILIAR 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul1:#13567F;--azul2:#1A2746;--azul3:#1B2744;--verde:#A1F40C;--amarillo:#FFC000;}
*{box-sizing:border-box;font-family:Poppins,sans-serif}
body{margin:0;background:#f4f4f4}
.header{background:linear-gradient(90deg,var(--azul3),var(--azul1));padding:20px;color:#fff}
.container{width:95%;max-width:1400px;margin:20px auto}
.card{background:#fff;padding:20px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.form-group{display:flex;flex-direction:column}
input,select,textarea{padding:10px}
.section-title{background:var(--azul2);color:var(--verde);padding:10px;margin:15px 0;border-radius:8px}
.buttons{margin-top:15px;display:flex;gap:10px}
.btn-save{background:var(--verde)}
.btn-clear{background:var(--amarillo)}
.tabcontent{display:block}
.footer{text-align:center;padding:20px}
</style>
</head>
<body>



<div class="header"><h1>BONIFICACIÓN FAMILIAR 2026</h1></div>
<div class="container"><div class="card">
<form id="formBonificacion">
<div class="section-title">Información del Titular</div>
<div class="grid">
<div class="form-group"><label>Cédula Titular</label><input type="number" id="cedulaTitular" required></div>
<div class="form-group"><label>Tipo Trámite</label><select id="tramite"><option>RECONOCER</option><option>DISMINUIR</option></select></div>
<div class="form-group"><label>Concepto</label><select id="concepto"><option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option><option>PRIMA DE ORDEN PUBLICO</option></select></div>
<div class="form-group"><label>Estado</label><select id="estado"><option>OK</option><option>FALTA REGISTRAR</option></select></div>
</div>
<div class="section-title">Fechas</div>
<div class="grid">
<div class="form-group"><label>Fecha J</label><input type="date" id="fechaJ"></div>
<div class="form-group"><label>Fecha K</label><input type="date" id="fechaK"></div>
<div class="form-group"><label>Nro GEPOL</label><input type="text" id="observaciones"></div>
</div>
<div class="section-title">Beneficiario</div>
<div class="grid">
<div class="form-group"><label>Tipo Beneficiario</label><select id="beneficiario"><option>HIJO1</option><option>HIJA1</option><option>COMPAÑERO</option><option>COMPAÑERA</option><option>CÓNYUGE</option></select></div>
<div class="form-group"><label>Nombre</label><input type="text" id="nombreBeneficiario"></div>
<div class="form-group"><label>Documento Beneficiario</label><input type="number" id="cedulaBeneficiario"></div>
<div class="form-group"><label>Sexo</label><select id="sexo"><option>M</option><option>F</option></select></div>
<div class="form-group"><label>Fecha Nacimiento</label><input type="date" id="fechaNacimiento"></div>
<div class="form-group"><label>Tipo Documento</label><select id="tipoDocumento"><option>CC</option><option>TI</option><option>RC</option><option>RM</option></select></div>
</div>
<div class="section-title">Soportes</div>
<div class="grid">
<div class="form-group"><label>Documento Soporte</label><select id="documentoSoporte"><option>Acta de Conciliación</option><option>Certificado de matrícula de la institución educativa</option><option>Registro Civil de Nacimiento</option><option>Registro Civil de Matrimonio</option></select></div>
<div class="form-group"><label>Expedido por</label><input type="text" id="expedidoPor"></div>
<div class="form-group"><label>Ciudad Sede</label><input type="text" id="ciudadSede"></div>
<div class="form-group"><label>Fecha Documento</label><input type="date" id="fechaDocumento"></div>
<div class="form-group"><label>Acto Administrativo</label><input type="text" id="actoAdministrativo"></div>
<div class="form-group"><label>Proyecto Resolución</label><select id="proyectoResolucion"><option>SI</option><option>NO</option></select></div>
</div>
<div class="buttons">
<button type="submit" class="btn-save">💾 Guardar Registro</button>
<button type="reset" class="btn-clear">🧹 Limpiar</button>
</div>
</form>
<hr>
<h3>Texto AP</h3>
<textarea id="textoAP" style="width:100%;height:250px"></textarea>
</div></div>
<div class="footer">Policía Nacional de Colombia</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxSUwfCermRJXo1BfVLd29DjJL8ckFj4qL3AJni3iFbX6E3lVz3xUaHz9VJd6UR-lO_/exec";

document
.getElementById("formBonificacion")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = {

        action: "guardar",

        E: document.getElementById("tramite").value,
        F: document.getElementById("concepto").value,
        H: document.getElementById("observaciones").value,
        I: document.getElementById("estado").value,
        J: document.getElementById("fechaJ").value,
        K: document.getElementById("fechaK").value,

        O: document.getElementById("cedulaTitular").value,
        P: document.getElementById("beneficiario").value,

        Y: document.getElementById("nombreBeneficiario").value,
        Z: document.getElementById("cedulaBeneficiario").value,

        AA: document.getElementById("sexo").value,
        AC: document.getElementById("fechaNacimiento").value,
        AE: document.getElementById("tipoDocumento").value,

        AH: document.getElementById("documentoSoporte").value,
        AI: document.getElementById("expedidoPor").value,
        AJ: document.getElementById("ciudadSede").value,
        AK: document.getElementById("fechaDocumento").value,
        AL: document.getElementById("actoAdministrativo").value,

        AT: document.getElementById("proyectoResolucion").value

    };

    try {

        const params = new URLSearchParams(data);

        const response = await fetch(
            WEBAPP_URL + "?" + params.toString(),
            {
                method: "GET"
            }
        );

        const result = await response.json();

        if(result.success){

            document.getElementById("textoAP").value =
            result.textoAP || "";

            alert(
                "Registro guardado correctamente\nFila: " +
                result.fila
            );

        } else {

            alert(
                "Error:\n" +
                result.error
            );

        }

    } catch(error){

        console.error(error);

        alert(
            "Error de conexión con Google Apps Script:\n" +
            error.message
        );

    }

});

</script>
</script>
</body>
</html>
