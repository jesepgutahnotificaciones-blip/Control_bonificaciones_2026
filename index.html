<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BONIFICACIÓN FAMILIAR 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root{
--azul1:#13567F;
--azul2:#1A2746;
--azul3:#1B2744;
--verde:#A1F40C;
}

*{box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
margin:0;
background:linear-gradient(rgba(10,20,40,.85),rgba(10,20,40,.9)),
url('1-fescol-policia-abuso-cilives-1.jpg');
background-size:cover;
min-height:100vh;
}

.header{
background:linear-gradient(90deg,var(--azul3),var(--azul1));
padding:20px;
color:#fff;
display:flex;
align-items:center;
gap:20px;
}

.logo{width:90px;}

.container{width:95%;max-width:1400px;margin:20px auto;}

.card{background:#fff;border-radius:15px;padding:20px;}

.tabs{
margin-bottom:15px;
}

.tabs button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-right:5px;
background:#ddd;
font-weight:600;
}

.tabcontent{display:none;}
.tabcontent.active{display:block;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input,select,textarea{
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

.section{
background:var(--azul2);
color:var(--verde);
padding:10px;
border-radius:8px;
margin:15px 0;
font-weight:600;
}

.btn-save{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--verde);
font-weight:600;
}
</style>
</head>

<body>

<div class="header">
<img class="logo" src="Escudo_Policía_Nacional_de_Colombia.png">
<h1>BONIFICACIÓN FAMILIAR 2026</h1>
</div>

<div class="container">
<div class="card">

<div class="tabs">
<button onclick="showTab('registro')">Registro</button>
<button onclick="showTab('resolucion')">Resolución</button>
<button onclick="showTab('consulta')">Consultar</button>
</div>

<!-- REGISTRO -->
<div id="registro" class="tabcontent active">

<form id="formBonificacion">

<div class="grid">

<input id="cedulaTitular" placeholder="Cédula Titular">

<select id="tramite">
<option>RECONOCER</option>
<option>DISMINUIR</option>
</select>

<select id="concepto">
<option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option>
<option>PRIMA DE ORDEN PUBLICO</option>
</select>

<select id="estado">
<option>OK</option>
<option>FALTA REGISTRAR</option>
</select>

<input type="date" id="fechaJ">
<input type="date" id="fechaK">
<input id="observaciones" placeholder="Nro GEPOL">

<select id="beneficiario">
<option>HIJO1</option>
<option>HIJA1</option>
<option>COMPAÑERO</option>
<option>COMPAÑERA</option>
<option>CÓNYUGE</option>
</select>

<input id="nombreBeneficiario">
<input id="cedulaBeneficiario">

<select id="sexo"><option>M</option><option>F</option></select>
<input type="date" id="fechaNacimiento">

<select id="tipoDocumento">
<option>CC</option>
<option>TI</option>
<option>RC</option>
<option>RM</option>
</select>

<select id="documentoSoporte">
<option>Acta de Conciliación</option>
<option>Registro Civil de Nacimiento</option>
</select>

<input id="expedidoPor">
<input id="ciudadSede">
<input type="date" id="fechaDocumento">
<input id="actoAdministrativo">

<select id="proyectoResolucion">
<option>SI</option>
<option>NO</option>
</select>

</div>

<button class="btn-save">GUARDAR</button>
</form>
</div>

<!-- RESOLUCION -->
<div id="resolucion" class="tabcontent">
<textarea id="textoAP" style="width:100%;height:350px" readonly></textarea>
</div>

<!-- CONSULTA -->
<div id="consulta" class="tabcontent">

<input id="cedulaBuscar" placeholder="Cédula">
<button class="btn-save" type="button" onclick="buscarRegistro()">Buscar</button>

<textarea id="textoConsulta" style="width:100%;height:300px" readonly></textarea>

</div>

</div>
</div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz8DyZGRhugSLe9PwlDS_x9LMvY8jL7lhPc3ZXg9y49R-xnA8vGtIhqzYtXOy6Jv9dM/exec";

function showTab(id){
document.querySelectorAll(".tabcontent").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* =========================
   GENERAR TEXTO AP
========================= */
function v(id){
return document.getElementById(id).value || "";
}

function generarTextoAP(){

const texto =
`📄 ACTO ADMINISTRATIVO - BONIFICACIÓN FAMILIAR

Se procede a ${v("tramite")} el concepto ${v("concepto")} con estado ${v("estado")}.

Titular: C.C ${v("cedulaTitular")}

Beneficiario: ${v("beneficiario")} - ${v("nombreBeneficiario")} (${v("cedulaBeneficiario")})

Fechas:
- Reconocimiento: ${v("fechaJ")}
- Oficio GEPOL: ${v("fechaK")}

Soporte: ${v("documentoSoporte")}
Expedido por: ${v("expedidoPor")} - ${v("ciudadSede")}
Fecha documento: ${v("fechaDocumento")}
Acto: ${v("actoAdministrativo")}

Documento generado automáticamente.`;

document.getElementById("textoAP").value = texto;
}

/* AUTO GENERACIÓN */
document.querySelectorAll("input, select").forEach(el=>{
el.addEventListener("input", generarTextoAP);
el.addEventListener("change", generarTextoAP);
});

/* INIT */
window.addEventListener("load", generarTextoAP);

/* GUARDAR */
document.getElementById("formBonificacion").addEventListener("submit", async (e)=>{
e.preventDefault();

const params = new URLSearchParams({
action:"guardar",
E:v("cedulaTitular"),
F:v("concepto"),
H:v("observaciones"),
I:v("estado"),
J:v("fechaJ"),
K:v("fechaK"),
O:v("cedulaTitular"),
P:v("beneficiario"),
Y:v("nombreBeneficiario"),
Z:v("cedulaBeneficiario"),
AA:v("sexo"),
AC:v("fechaNacimiento"),
AE:v("tipoDocumento"),
AH:v("documentoSoporte"),
AI:v("expedidoPor"),
AJ:v("ciudadSede"),
AK:v("fechaDocumento"),
AL:v("actoAdministrativo"),
AT:v("proyectoResolucion")
});

try{
const res = await fetch(WEBAPP_URL + "?" + params.toString());
const data = await res.json();

if(data.success){
alert("Guardado fila: " + data.fila);
document.getElementById("textoAP").value = data.textoAP || "";
}else{
alert(data.error || "Error");
}

}catch(err){
alert("Error conexión: " + err.message);
}
});

/* BUSCAR */
async function buscarRegistro(){

const cedula = v("cedulaBuscar");
if(!cedula){alert("Ingrese cédula");return;}

const res = await fetch(WEBAPP_URL + "?action=buscar&cedula=" + encodeURIComponent(cedula));
const data = await res.json();

document.getElementById("textoConsulta").value =
data.success ? ("FILA: " + data.fila + "\n\n" + data.textoAP) : data.error;
}

</script>

</body>
</html>
