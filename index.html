<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BONIFICACIÓN FAMILIAR 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
:root {
  --azul1:#13567F;
  --azul2:#1A2746;
  --azul3:#1B2744;
  --verde:#A1F40C;
  --amarillo:#FFC000;
}

*{box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
margin:0;
background:linear-gradient(rgba(10,20,40,.85),rgba(10,20,40,.9)),
url('1-fescol-policia-abuso-cilives-1.jpg');
background-size:cover;
min-height:100vh;
}

.header{
background:linear-gradient(90deg,var(--azul3),var(--azul1));
padding:20px;
color:#fff;
display:flex;
align-items:center;
gap:20px;
}

.logo{width:90px;}

.container{width:95%;max-width:1400px;margin:20px auto;}

.card{
background:#fff;
border-radius:15px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.form-group{display:flex;flex-direction:column;}

label{font-weight:500;margin-bottom:5px;}

input,select,textarea{
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

.section{
background:var(--azul2);
color:var(--verde);
padding:10px;
border-radius:8px;
margin:15px 0;
font-weight:600;
}

.btn-save{
margin-top:20px;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:var(--verde);
font-weight:600;
}

.tabcontent{display:none;}
.tabcontent.active{display:block;}
</style>
</head>

<body>

<div class="header">
<img class="logo" src="Escudo_Policía_Nacional_de_Colombia.png" />
<h1>BONIFICACIÓN FAMILIAR 2026</h1>
</div>

<div class="container">

<div class="card">

<div class="tabs">
<button onclick="showTab('registro')">Registro</button>
<button onclick="showTab('resolucion')">Resolución</button>
<button onclick="showTab('consulta')">Consultar</button>
</div>

<!-- ================= REGISTRO ================= -->
<div id="registro" class="tabcontent active">

<form id="formBonificacion">

<!-- TITULAR -->
<div class="section">Información del Titular</div>

<div class="grid">
<div class="form-group">
<label>Cédula Titular</label>
<input type="text" id="cedulaTitular" />
</div>

<div class="form-group">
<label>Tipo Trámite</label>
<select id="tramite">
<option>RECONOCER</option>
<option>DISMINUIR</option>
</select>
</div>

<div class="form-group">
<label>Concepto</label>
<select id="concepto">
<option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option>
<option>PRIMA DE ORDEN PUBLICO</option>
</select>
</div>

<div class="form-group">
<label>Estado</label>
<select id="estado">
<option>OK</option>
<option>FALTA REGISTRAR</option>
</select>
</div>
</div>

<!-- FECHAS -->
<div class="section">Fechas y Observaciones</div>

<div class="grid">
<div class="form-group">
<label>Fecha Fiscal de Reconocimiento</label>
<input type="date" id="fechaJ" />
</div>

<div class="form-group">
<label>Fecha Oficio GEPOL</label>
<input type="date" id="fechaK" />
</div>

<div class="form-group">
<label>Nro. GEPOL</label>
<input type="text" id="observaciones" />
</div>
</div>

<!-- BENEFICIARIO -->
<div class="section">Información Beneficiario</div>

<div class="grid">
<div class="form-group">
<label>Tipo Beneficiario</label>
<select id="beneficiario">
<option>HIJO1</option>
<option>HIJA1</option>
<option>COMPAÑERO</option>
<option>COMPAÑERA</option>
<option>CÓNYUGE</option>
</select>
</div>

<div class="form-group">
<label>Nombres y Apellidos</label>
<input type="text" id="nombreBeneficiario" />
</div>

<div class="form-group">
<label>Documento Beneficiario</label>
<input type="text" id="cedulaBeneficiario" />
</div>

<div class="form-group">
<label>Sexo</label>
<select id="sexo"><option>M</option><option>F</option></select>
</div>

<div class="form-group">
<label>Fecha Nacimiento</label>
<input type="date" id="fechaNacimiento" />
</div>

<div class="form-group">
<label>Tipo Documento</label>
<select id="tipoDocumento">
<option>CC</option><option>TI</option><option>RC</option><option>RM</option>
</select>
</div>
</div>

<!-- SOPORTES -->
<div class="section">Soportes Documentales</div>

<div class="grid">
<div class="form-group">
<label>Documento Soporte</label>
<select id="documentoSoporte">
<option>Acta de Conciliación</option>
<option>Certificado de matrícula</option>
<option>Registro Civil de Nacimiento</option>
<option>Registro Civil de Matrimonio</option>
</select>
</div>

<div class="form-group">
<label>Expedido por</label>
<input type="text" id="expedidoPor" />
</div>

<div class="form-group">
<label>Ciudad Sede</label>
<input type="text" id="ciudadSede" />
</div>

<div class="form-group">
<label>Fecha Documento</label>
<input type="date" id="fechaDocumento" />
</div>

<div class="form-group">
<label>N° Acto Administrativo</label>
<input type="text" id="actoAdministrativo" />
</div>

<div class="form-group">
<label>Proyecto Resolución</label>
<select id="proyectoResolucion">
<option>SI</option>
<option>NO</option>
</select>
</div>
</div>

<button type="submit" class="btn-save">💾 Guardar Registro</button>

</form>
</div>

<!-- RESOLUCION -->
<div id="resolucion" class="tabcontent">
<textarea id="textoAP" style="width:100%;height:350px" readonly></textarea>
</div>

<!-- CONSULTA -->
<div id="consulta" class="tabcontent">

<input id="cedulaBuscar" placeholder="Cédula Titular" />
<button class="btn-save" type="button" onclick="buscarRegistro()">Buscar</button>

<textarea id="textoConsulta" style="width:100%;height:350px" readonly></textarea>

</div>

</div>
</div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz8DyZGRhugSLe9PwlDS_x9LMvY8jL7lhPc3ZXg9y49R-xnA8vGtIhqzYtXOy6Jv9dM/exec";

/* ================= TAB ================= */
function showTab(id){
document.querySelectorAll(".tabcontent").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ================= TEXTO AP ================= */
function generarTextoAP(){

let texto = "";

texto += "📄 ACTO ADMINISTRATIVO BONIFICACIÓN FAMILIAR\n\n";

texto += "Trámite: " + document.getElementById("tramite").value + "\n";
texto += "Concepto: " + document.getElementById("concepto").value + "\n";
texto += "Estado: " + document.getElementById("estado").value + "\n\n";

texto += "Titular C.C: " + document.getElementById("cedulaTitular").value + "\n\n";

texto += "Beneficiario: " + document.getElementById("beneficiario").value + "\n";
texto += "Nombre: " + document.getElementById("nombreBeneficiario").value + "\n";
texto += "Documento: " + document.getElementById("cedulaBeneficiario").value + "\n\n";

texto += "Fechas:\n";
texto += "- Reconocimiento: " + document.getElementById("fechaJ").value + "\n";
texto += "- Oficio GEPOL: " + document.getElementById("fechaK").value + "\n\n";

texto += "Soporte: " + document.getElementById("documentoSoporte").value + "\n";
texto += "Expedido por: " + document.getElementById("expedidoPor").value + "\n";
texto += "Ciudad: " + document.getElementById("ciudadSede").value + "\n";
texto += "Fecha documento: " + document.getElementById("fechaDocumento").value + "\n";
texto += "Acto: " + document.getElementById("actoAdministrativo").value + "\n\n";

texto += "Documento sujeto a verificación institucional.";

document.getElementById("textoAP").value = texto;
}

/* ================= AUTO UPDATE ================= */
document.querySelectorAll("input, select").forEach(el=>{
el.addEventListener("input", generarTextoAP);
el.addEventListener("change", generarTextoAP);
});

/* ================= GUARDAR ================= */
document.getElementById("formBonificacion").addEventListener("submit", async (e)=>{
e.preventDefault();

const params = new URLSearchParams({
action:"guardar",
E:tramite.value,
F:concepto.value,
H:observaciones.value,
I:estado.value,
J:fechaJ.value,
K:fechaK.value,
O:cedulaTitular.value,
P:beneficiario.value,
Y:nombreBeneficiario.value,
Z:cedulaBeneficiario.value,
AA:sexo.value,
AC:fechaNacimiento.value,
AE:tipoDocumento.value,
AH:documentoSoporte.value,
AI:expedidoPor.value,
AJ:ciudadSede.value,
AK:fechaDocumento.value,
AL:actoAdministrativo.value,
AT:proyectoResolucion.value
});

try{
const res = await fetch(WEBAPP_URL + "?" + params.toString());
const data = await res.json();

if(data.success){
alert("Guardado en fila " + data.fila);
document.getElementById("textoAP").value = data.textoAP || "";
}else{
alert(data.error || "Error");
}
}catch(err){
alert(err.message);
}
});

/* ================= BUSCAR ================= */
async function buscarRegistro(){

const cedula = cedulaBuscar.value.trim();

if(!cedula) return alert("Ingrese cédula");

try{
const res = await fetch(WEBAPP_URL + "?action=buscar&cedula=" + encodeURIComponent(cedula));
const data = await res.json();

textoConsulta.value =
data.success
? "FILA: " + data.fila + "\n\n" + data.textoAP
: data.error;

}catch(err){
alert(err.message);
}
}

</script>

</body>
</html>
