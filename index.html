<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BONIFICACIÓN FAMILIAR 2026</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --azul1: #13567F;
            --azul2: #1A2746;
            --azul3: #1B2744;
            --verde: #A1F40C;
            --amarillo: #FFC000;
        }

        * {
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            margin: 0;
            background:
                linear-gradient(rgba(10, 20, 40, .85), rgba(10, 20, 40, .9)),
                url('1-fescol-policia-abuso-cilives-1.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, var(--azul3), var(--azul1));
            padding: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 90px;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
        }

        .tabs {
            margin-bottom: 20px;
        }

        .tabs button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 5px;
            font-weight: 600;
        }

        .tabcontent {
            display: none;
        }

        .tabcontent.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .section {
            background: var(--azul2);
            color: var(--verde);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 600;
        }

        .btn-save {
            margin-top: 20px;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            background: var(--verde);
            font-weight: 600;
        }

        .contador-box {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .contador-item {
            background: var(--azul1);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            flex: 1;
            min-width: 220px;
            text-align: center;
        }

        .contador-item span {
            display: block;
            font-size: 22px;
            color: var(--amarillo);
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="header">

        <img class="logo" src="Escudo_Policía_Nacional_de_Colombia.png" alt="Logo Policía Nacional de Colombia" />

        <div>
            <h1>BONIFICACIÓN FAMILIAR 2026 JESEP</h1>
        </div>

    </div>

    <div class="container">

        <div class="card">

            <div class="tabs">

                <button type="button" onclick="showTab('registro')">Registro</button>
                <button type="button" onclick="showTab('resolucion')">Resolución</button>
                <button type="button" onclick="showTab('consulta')">Consultar</button>

            </div>

            <!-- PESTAÑA REGISTRO -->
            <div id="registro" class="tabcontent active">

                <div class="contador-box">

                    <div class="contador-item">
                        Registros actuales en la tabla
                        <span id="totalRegistros">…</span>
                    </div>

                    <div class="contador-item">
                        Este registro se guardará en la fila
                        <span id="proximaFila">…</span>
                    </div>

                </div>

                <form id="formBonificacion">

                    <div class="grid">

                        <div class="form-group">
                            <label>Cédula Titular</label>
                            <input type="text" id="cedulaTitular" inputmode="numeric" required />
                        </div>

                        <div class="form-group">
                            <label>Sexo</label>
                            <select id="sexo">
                                <option>M</option>
                                <option>F</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Tipo Trámite</label>
                            <select id="tramite">
                                <option>RECONOCER</option>
                                <option>DISMINUIR</option>
                                <option>DISOLUCIÓN DE LA SOCIEDAD CONYUGAL</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Concepto</label>
                            <select id="concepto">
                                <option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option>
                                <option>PRIMA DE ORDEN PUBLICO</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Estado</label>
                            <select id="estado">
                                <option>OK</option>
                                <option>FALTA REGISTRAR</option>
                            </select>
                        </div>

                    </div>

                    <div class="section">
                        Fechas y Observaciones
                    </div>

                    <div class="grid">

                        <div class="form-group">
                            <label>Fecha Fiscal de Reconocimiento</label>
                            <input type="date" id="fechaJ" />
                        </div>

                        <div class="form-group">
                            <label>Fecha Oficio GEPOL</label>
                            <input type="date" id="fechaK" />
                        </div>

                        <div class="form-group">
                            <label>Nro. GEPOL</label>
                            <input type="text" id="observaciones" />
                        </div>

                    </div>

                    <div class="section">
                        Información Beneficiario
                    </div>

                    <div class="grid">

                        <div class="form-group">
                            <label>Tipo Beneficiario</label>
                            <select id="beneficiario">
                                <option>HIJO1</option>
                                <option>HIJA1</option>
                                <option>COMPAÑERO</option>
                                <option>COMPAÑERA</option>
                                <option>CÓNYUGE</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Nombres y Apellidos</label>
                            <input type="text" id="nombreBeneficiario" />
                        </div>

                        <div class="form-group">
                            <label>Número Documento Beneficiario</label>
                            <input type="text" id="cedulaBeneficiario" inputmode="numeric" />
                        </div>

                        <div class="form-group">
                            <label>Fecha Nacimiento</label>
                            <input type="date" id="fechaNacimiento" />
                        </div>

                        <div class="form-group">
                            <label>Tipo Documento</label>
                            <select id="tipoDocumento">
                                <option>CC</option>
                                <option>TI</option>
                                <option>RC</option>
                                <option>RM</option>
                            </select>
                        </div>

                    </div>

                    <div class="section">
                        Soportes
                    </div>

                    <div class="grid">

                        <div class="form-group">
                            <label>Documento Soporte</label>
                            <select id="documentoSoporte">
                                <option>Acta de Conciliación</option>
                                <option>Certificado de matrícula de la institución educativa</option>
                                <option>Registro Civil de Nacimiento</option>
                                <option>Registro Civil de Matrimonio</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Expedido por</label>
                            <input type="text" id="expedidoPor" />
                        </div>

                        <div class="form-group">
                            <label>Ciudad Sede</label>
                            <input type="text" id="ciudadSede" />
                        </div>

                        <div class="form-group">
                            <label>Fecha Documento</label>
                            <input type="date" id="fechaDocumento" />
                        </div>

                        <div class="form-group">
                            <label>N° Acto Administrativo</label>
                            <input type="text" id="actoAdministrativo" />
                        </div>

                        <div class="form-group">
                            <label>Incluido Proyecto Resolución</label>
                            <select id="proyectoResolucion">
                                <option>SI</option>
                                <option>NO</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn-save">💾 Guardar Registro</button>

                </form>

            </div>

            <!-- PESTAÑA RESOLUCIÓN -->
            <div id="resolucion" class="tabcontent">

                <h3>Texto AP</h3>

                <textarea id="textoAP" style="width:100%;height:300px" readonly></textarea>

            </div>

            <!-- PESTAÑA CONSULTA -->
            <div id="consulta" class="tabcontent">

                <h3>Consultar Registro</h3>

                <div class="grid">

                <div class="form-group">
                    <label>Cédula Titular</label>
                    <input type="text" id="cedulaBuscar" inputmode="numeric" />
                </div>

                <div class="form-group">
                    <label>Nuevo Estado</label>
                    <select id="nuevoEstado">
                        <option value="OK">OK</option>
                        <option value="FALTA REGISTRAR">FALTA REGISTRAR</option>
                    </select>
                </div>

            </div>

            <button type="button" class="btn-save" onclick="buscarRegistro()">
                🔍 Buscar
            </button>

            <button type="button" class="btn-save" onclick="actualizarEstado()">
    ✏️ Actualizar Estado
</button>

<br><br>

<label>Resultados</label>

<textarea
    id="textoConsulta"
    style="width:100%;height:350px"
    readonly>
</textarea>

</div> <!-- consulta -->
</div> <!-- card -->
</div> <!-- container -->


    <script>
        const WEBAPP_URL =
            "https://script.google.com/macros/s/AKfycbxLyqWiGyRRei5nv7rRTMA4vBQhRST9jfzG9DpfGYKBF2I7Am8UGPrqEgj9XNTUYMIP/exec";

        function showTab(id) {
            document
                .querySelectorAll(".tabcontent")
                .forEach(tab => tab.classList.remove("active"));

            document.getElementById(id).classList.add("active");

            if (id === "registro") {
                actualizarContador();
            }
        }

        // Consulta al backend cuántos registros existen y cuál será el próximo
        // Requiere que el Apps Script soporte action=contar y responda
        // { success: true, total: <numero> }
        async function actualizarContador() {

            const totalEl = document.getElementById("totalRegistros");
            const proximaEl = document.getElementById("proximaFila");

            totalEl.textContent = "…";
            proximaEl.textContent = "…";

            try {

                const res = await fetch(WEBAPP_URL + "?action=contar");
                const raw = await res.text();

                let data;

                try {
                    data = JSON.parse(raw);
                } catch (parseErr) {
                    console.error("Respuesta no es JSON válido:", raw);
                    totalEl.textContent = "Error";
                    proximaEl.textContent = "Ver consola (F12)";
                    return;
                }

                if (data.success) {

                    const total = Number(data.total) || 0;

                    totalEl.textContent = total;
                    proximaEl.textContent = "Fila " + (total + 1);

                } else {

                    console.error("Backend respondió error:", data.error);
                    totalEl.textContent = "Error";
                    proximaEl.textContent = data.error || "Ver consola (F12)";
                }

            } catch (err) {

                console.error("Error de red/fetch en actualizarContador:", err);
                totalEl.textContent = "Sin conexión";
                proximaEl.textContent = err.message;
            }
        }

        document.getElementById("formBonificacion").addEventListener("submit", async function (e) {

    e.preventDefault();

    const params = new URLSearchParams({

        action: "guardar",

        E: document.getElementById("tramite").value,
        F: document.getElementById("concepto").value,
        H: document.getElementById("observaciones").value,
        I: document.getElementById("estado").value,
        J: document.getElementById("fechaJ").value,
        K: document.getElementById("fechaK").value,

        O: document.getElementById("cedulaTitular").value,
        P: document.getElementById("beneficiario").value,

        Y: document.getElementById("nombreBeneficiario").value,
        Z: document.getElementById("cedulaBeneficiario").value,

        AA: document.getElementById("sexo").value,
        AC: document.getElementById("fechaNacimiento").value,
        AE: document.getElementById("tipoDocumento").value,

        AH: document.getElementById("documentoSoporte").value,
        AI: document.getElementById("expedidoPor").value,
        AJ: document.getElementById("ciudadSede").value,
        AK: document.getElementById("fechaDocumento").value,
        AL: document.getElementById("actoAdministrativo").value,

        AT: document.getElementById("proyectoResolucion").value

    });

    try {

        const response = await fetch(
            WEBAPP_URL + "?" + params.toString()
        );

        const result = await response.json();

        if(result.success){

            alert("Registro guardado en fila: " + result.fila);

            document.getElementById("textoAP").value =
                result.textoAP || "";

            showTab("resolucion");

            // Refresca el contador para reflejar el nuevo total
            actualizarContador();

        } else {

            alert(result.error || "Error al guardar");
        }

    } catch (error) {

        alert("Error al guardar: " + error.message);
    }
});

        async function buscarRegistro() {

    const cedula =
        document.getElementById("cedulaBuscar")
        .value
        .trim();

    if (!cedula) {

        alert("Ingrese cédula");
        return;

    }

    try {

        const res = await fetch(
            WEBAPP_URL +
            "?action=buscar&cedula=" +
            encodeURIComponent(cedula)
        );

        const data = await res.json();

        let txt = "";

        if (data.success) {

            txt +=
                "TOTAL REGISTROS ENCONTRADOS: " +
                data.total +
                "\n\n";

            data.registros.forEach((item, index) => {

                txt +=
                    "══════════════════════════════════════\n";

                txt +=
                    "REGISTRO #" +
                    (index + 1) +
                    "\n";

                txt +=
                    "══════════════════════════════════════\n";

                txt +=
                    "FILA: " +
                    item.fila +
                    "\n";

                txt +=
                    "FECHA GEPOL: " +
                    item.fechaGepol +
                    "\n";

                txt +=
                    "CÉDULA TITULAR: " +
                    item.cedulaTitular +
                    "\n";

                txt +=
                    "TIPO TRÁMITE: " +
                    item.tramite +
                    "\n";

                txt +=
                    "CONCEPTO: " +
                    item.concepto +
                    "\n";

                txt +=
                    "ESTADO: " +
                    item.estado +
                    "\n";

                txt +=
                    "BENEFICIARIO: " +
                    item.beneficiario +
                    "\n";

                txt +=
                    "NOMBRE BENEFICIARIO: " +
                    item.nombreBeneficiario +
                    "\n";

                txt +=
                    "DOCUMENTO BENEFICIARIO: " +
                    item.documentoBeneficiario +
                    "\n";

                txt +=
                    "TIPO DOCUMENTO: " +
                    item.tipoDocumento +
                    "\n";

                txt +=
                    "DOCUMENTO SOPORTE: " +
                    item.documentoSoporte +
                    "\n\n";

                txt +=
                    "TEXTO AP:\n";

                txt +=
                    (item.textoAP || "Sin información");

                txt +=
                    "\n\n";
            });

        } else {

            txt =
                data.error ||
                "No se encontraron registros";
        }

        document.getElementById(
            "textoConsulta"
        ).value = txt;

    } catch (err) {

        alert(
            "Error conexión: " +
            err.message
        );
    }
}

async function actualizarEstado() {

    const cedula =
        document.getElementById("cedulaBuscar")
        .value
        .trim();

    const estado =
        document.getElementById("nuevoEstado")
        .value;

    if (!cedula) {

        alert("Ingrese la cédula titular");
        return;
    }

    try {

        const res = await fetch(
            WEBAPP_URL +
            "?action=actualizarEstado" +
            "&cedula=" +
            encodeURIComponent(cedula) +
            "&estado=" +
            encodeURIComponent(estado)
        );

        const data = await res.json();

        if (data.success) {

            alert(
                "Estado actualizado correctamente"
            );

            buscarRegistro();

        } else {

            alert(
                data.error ||
                "No fue posible actualizar"
            );
        }

    } catch (error) {

        alert(
            "Error: " +
            error.message
        );
    }
}

        // Carga el contador al abrir la página (pestaña Registro está activa por defecto)
        actualizarContador();

    </script>

</body>

</html>
