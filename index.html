<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BONIFICACIÓN FAMILIAR 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --azul1:#13567F;
    --azul2:#1A2746;
    --azul3:#1B2744;
    --verde:#A1F40C;
    --amarillo:#FFC000;
}

*{
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    margin:0;
    background:
    linear-gradient(
        rgba(10,20,40,.85),
        rgba(10,20,40,.9)
    ),
    url('1-fescol-policia-abuso-cilives-1.jpg');
    background-size:cover;
    background-position:center;
    min-height:100vh;
}

.header{
    background:linear-gradient(
        90deg,
        var(--azul3),
        var(--azul1)
    );
    padding:20px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    width:90px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:20px auto;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.tabs{
    margin-bottom:20px;
}

.tabs button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:5px;
    font-weight:600;
}

.tabcontent{
    display:none;
}

.tabcontent.active{
    display:block;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:5px;
    font-weight:500;
}

input,
select,
textarea{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.section{
    background:var(--azul2);
    color:var(--verde);
    padding:10px;
    border-radius:8px;
    margin:15px 0;
    font-weight:600;
}

.btn-save{
    margin-top:20px;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    background:var(--verde);
    font-weight:600;
}

</style>
</head>

<body>

<div class="header">

    <img
    class="logo"
    src="Escudo_Policía_Nacional_de_Colombia.png">

    <div>
        <h1>BONIFICACIÓN FAMILIAR 2026</h1>
    </div>

</div>

<div class="container">

<div class="card">

<div class="tabs">

<button type="button" onclick="showTab('registro')">
    Registro
    </button>

    <button type="button" onclick="showTab('resolucion')">
    Resolución
    </button>

    <button type="button" onclick="showTab('consulta')">
    Consultar
    </button>

</div>

<div
id="registro"
class="tabcontent active">

<form id="formBonificacion">

<div class="section">
Información del Titular
</div>

<div class="grid">

<div class="form-group">
<label>Cédula Titular</label>
<input
type="text"
id="cedulaTitular"
inputmode="numeric"
required>
</div>

<div class="form-group">
<label>Tipo Trámite</label>
<select id="tramite">
<option>RECONOCER</option>
<option>DISMINUIR</option>
</select>
</div>

<div class="form-group">
<label>Concepto</label>
<select id="concepto">
<option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option>
<option>PRIMA DE ORDEN PUBLICO</option>
</select>
</div>

<div class="form-group">
<label>Estado</label>
<select id="estado">
<option>OK</option>
<option>FALTA REGISTRAR</option>
</select>
</div>

</div>

<div class="section">
Fechas y Observaciones
</div>

<div class="grid">

<div class="form-group">
<label>Fecha Fiscal de Reconocimiento</label>
<input type="date" id="fechaJ">
</div>

<div class="form-group">
<label>Fecha Oficio GEPOL</label>
<input type="date" id="fechaK">
</div>

<div class="form-group">
<label>Nro. GEPOL</label>
<input type="text" id="observaciones">
</div>

</div>

<div class="section">
Información Beneficiario
</div>

<div class="grid">

<div class="form-group">
<label>Tipo Beneficiario</label>
<select id="beneficiario">
<option>HIJO1</option>
<option>HIJA1</option>
<option>COMPAÑERO</option>
<option>COMPAÑERA</option>
<option>CÓNYUGE</option>
</select>
</div>

<div class="form-group">
<label>Nombres y Apellidos</label>
<input
type="text"
id="nombreBeneficiario">
</div>

<div class="form-group">
<label>Número Documento Beneficiario</label>
<input
type="text"
id="cedulaBeneficiario"
inputmode="numeric">
</div>

<div class="form-group">
<label>Sexo</label>
<select id="sexo">
<option>M</option>
<option>F</option>
</select>
</div>

<div class="form-group">
<label>Fecha Nacimiento</label>
<input
type="date"
id="fechaNacimiento">
</div>

<div class="form-group">
<label>Tipo Documento</label>
<select id="tipoDocumento">
<option>CC</option>
<option>TI</option>
<option>RC</option>
<option>RM</option>
</select>
</div>

</div>

<div class="section">
Soportes
</div>

<div class="grid">

<div class="form-group">
<label>Documento Soporte</label>
<select id="documentoSoporte">
<option>Acta de Conciliación</option>
<option>Certificado de matrícula de la institución educativa</option>
<option>Registro Civil de Nacimiento</option>
<option>Registro Civil de Matrimonio</option>
</select>
</div>

<div class="form-group">
<label>Expedido por</label>
<input type="text" id="expedidoPor">
</div>

<div class="form-group">
<label>Ciudad Sede</label>
<input type="text" id="ciudadSede">
</div>

<div class="form-group">
<label>Fecha Documento</label>
<input type="date" id="fechaDocumento">
</div>

<div class="form-group">
<label>N° Acto Administrativo</label>
<input type="text" id="actoAdministrativo">
</div>

<div class="form-group">
<label>Incluido Proyecto Resolución</label>
<select id="proyectoResolucion">
<option>SI</option>
<option>NO</option>
</select>
</div>

</div>

<button
type="submit"
class="btn-save">
💾 Guardar Registro
</button>

</form>

</div>

<div
id="resolucion"
class="tabcontent">

<div id="consulta" class="tabcontent">

    <h3>Consultar Registro</h3>

    <div class="grid">

        <div class="form-group">
            <label>Cédula Titular</label>
            <input
                type="text"
                id="cedulaBuscar"
                inputmode="numeric">
        </div>

    </div>

    <br>

    <button
        type="button"
        class="btn-save"
        onclick="buscarRegistro()">

        🔍 Buscar

    </button>

    <br><br>

    <label>Texto AP</label>

    <textarea
        id="textoConsulta"
        style="width:100%;height:300px"
        readonly>
    </textarea>

</div>

<h3>Texto AP</h3>

<textarea
id="textoAP"
style="width:100%;height:300px"
readonly>
</textarea>

</div>

</div>

</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbz8DyZGRhugSLe9PwlDS_x9LMvY8jL7lhPc3ZXg9y49R-xnA8vGtIhqzYtXOy6Jv9dM/exec";

function showTab(id){

    document
    .querySelectorAll(".tabcontent")
    .forEach(tab => tab.classList.remove("active"));

    document
    .getElementById(id)
    .classList.add("active");
}

document
.getElementById("formBonificacion")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = {

        action:"guardar",

        E: document.getElementById("tramite").value,
        F: document.getElementById("concepto").value,
        H: document.getElementById("observaciones").value,
        I: document.getElementById("estado").value,
        J: document.getElementById("fechaJ").value,
        K: document.getElementById("fechaK").value,

        O: document.getElementById("cedulaTitular").value,
        P: document.getElementById("beneficiario").value,

        Y: document.getElementById("nombreBeneficiario").value,
        Z: document.getElementById("cedulaBeneficiario").value,

        AA: document.getElementById("sexo").value,
        AC: document.getElementById("fechaNacimiento").value,
        AE: document.getElementById("tipoDocumento").value,

        AH: document.getElementById("documentoSoporte").value,
        AI: document.getElementById("expedidoPor").value,
        AJ: document.getElementById("ciudadSede").value,
        AK: document.getElementById("fechaDocumento").value,
        AL: document.getElementById("actoAdministrativo").value,

        AT: document.getElementById("proyectoResolucion").value
    };

    async function buscarRegistro(){

    const cedula =
        document.getElementById("cedulaBuscar").value;

    if(!cedula){

        alert("Ingrese una cédula");

        return;
    }

    try{

        const url =
            WEBAPP_URL +
            "?action=buscar&cedula=" +
            encodeURIComponent(cedula);

        const response =
            await fetch(url);

        const result =
            await response.json();

        console.log(result);

        if(result.success){

            document
                .getElementById("textoConsulta")
                .value =
                result.textoAP || "";

        }else{

            alert(
                result.error ||
                "No se encontró información"
            );

        }

    }catch(error){

        alert(
            "Error de conexión:\n" +
            error.message
        );

    }

}

    try{

        const params =
        new URLSearchParams(data);

        const url =
        WEBAPP_URL +
        "?" +
        params.toString();

        console.log(url);

        const response =
        await fetch(url);

        const result =
        await response.json();

        console.log(result);

        if(result.success){

            document
            .getElementById("textoAP")
            .value =
            result.textoAP || "";

            showTab("resolucion");

            alert(
                "Registro guardado correctamente.\nFila: "
                + result.fila
            );

        }else{

            alert(
                "Error:\n" +
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );
        }

    }catch(error){

        console.error(error);

        alert(
            "Error de conexión:\n" +
            error.message
        );
    }

});

</script>

</body>
</html>
