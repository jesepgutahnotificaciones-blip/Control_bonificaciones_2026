<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BONIFICACIÓN FAMILIAR 2026</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --azul1: #13567F;
            --azul2: #1A2746;
            --azul3: #1B2744;
            --verde: #A1F40C;
            --amarillo: #FFC000;
        }

        * {
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            margin: 0;
            background:
                linear-gradient(rgba(10, 20, 40, .85), rgba(10, 20, 40, .9)),
                url('1-fescol-policia-abuso-cilives-1.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, var(--azul3), var(--azul1));
            padding: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 90px;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
        }

        .tabs {
            margin-bottom: 20px;
        }

        .tabs button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 5px;
            font-weight: 600;
        }

        .tabcontent {
            display: none;
        }

        .tabcontent.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .section {
            background: var(--azul2);
            color: var(--verde);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 600;
        }

        .btn-save {
            margin-top: 20px;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            background: var(--verde);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="header">

        <img class="logo" src="Escudo_Policía_Nacional_de_Colombia.png" alt="Logo Policía Nacional de Colombia" />

        <div>
            <h1>BONIFICACIÓN FAMILIAR 2026</h1>
        </div>

    </div>

    <div class="container">

        <div class="card">

            <div class="tabs">

                <button type="button" onclick="showTab('registro')">Registro</button>
                <button type="button" onclick="showTab('resolucion')">Resolución</button>
                <button type="button" onclick="showTab('consulta')">Consultar</button>

            </div>

            <!-- PESTAÑA REGISTRO -->
            <div id="registro" class="tabcontent active">

                <form id="formBonificacion">

                    <div class="grid">

                        <div class="form-group">
                            <label>Cédula Titular</label>
                            <input type="text" id="cedulaTitular" inputmode="numeric" required />
                        </div>

                        <div class="form-group">
                            <label>Tipo Trámite</label>
                            <select id="tramite">
                                <option>RECONOCER</option>
                                <option>DISMINUIR</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Concepto</label>
                            <select id="concepto">
                                <option>BONIFICACION PARA LA ASISTENCIA FAMILIAR</option>
                                <option>PRIMA DE ORDEN PUBLICO</option>
                            </select
